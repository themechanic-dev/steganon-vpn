<!--
  Steganon — interface icon.
  A shield with a water level that stops at its boundary: being watertight is
  not the absence of pressure, it is pressure that does not get through. Drawn
  on the 16 pixel grid so it stays legible at tray size.
  Follows the text colour, like every symbolic icon.
  The shield outline
  The level: solid below, waved at the surface
-->
